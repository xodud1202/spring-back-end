# 예시 전용: 자동 로드되지 않습니다. 실제 비밀번호/해시는 넣지 않습니다.
news.oauth.enabled=false
news.oauth.username=gpt_news_insert
news.oauth.issuer=https://be.xodud1202.kro.kr
news.oauth.resource=https://be.xodud1202.kro.kr/api/news/mcp
# USER_BASE의 정상 상태(02)인 3번 계정만 허용합니다. username은 해당 LOGIN_ID와 일치해야 합니다.
news.oauth.owner-usr-no=3
# client-id는 일반 문자열이며 아래 세 값은 운영 준비 시 지정합니다.
news.oauth.client-id=
# 서버에서 읽을 수 있는 클라이언트 secret BCrypt 파일의 절대 경로입니다.
news.oauth.client-secret-hash-file=
news.oauth.redirect-uri=
# 성공한 refresh마다 연장되는 미사용 기한입니다. 고정 재승인 주기가 아닙니다.
news.oauth.refresh-inactivity-timeout=30d
